name: Cost Check

on:
  pull_request:
    paths:
      - '**.yaml'
      - '**.yml'

permissions:
  contents: read
  pull-requests: write    # ← Make sure this is set!
  issues: write           # ← Add this line

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: WozzHQ/wozz/action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cost-threshold: 100

