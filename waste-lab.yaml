apiVersion: v1
kind: Namespace
metadata:
  name: waste-lab
---
# A) Idle but heavily requested: should look "wasteful" once kubectl top is available
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle-overrequested
  namespace: waste-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: idle-overrequested
  template:
    metadata:
      labels:
        app: idle-overrequested
    spec:
      containers:
      - name: web
        image: nginx:alpine
        resources:
          requests:
            cpu: "600m"
            memory: "2Gi"    # Increased from 512Mi
          limits:
            cpu: "1000m"
            memory: "1Gi"
        ports:
        - containerPort: 80
---
# B) Requests tiny, limits huge: should look risky/over-allocated even WITHOUT metrics-server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiny-request-huge-limit
  namespace: waste-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tiny-request-huge-limit
  template:
    metadata:
      labels:
        app: tiny-request-huge-limit
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo:1.0
        args: ["-text=hello"]
        ports:
        - containerPort: 5678
        resources:
          requests:
            cpu: "500m"     # Increased from 25m
            memory: "32Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
---
# C) No requests/limits at all: common real-world issue
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-resources-specified
  namespace: waste-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-resources-specified
  template:
    metadata:
      labels:
        app: no-resources-specified
    spec:
      containers:
      - name: app
        image: busybox
        command: ["sh","-c","while true; do echo ok; sleep 60; done"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
---
# D) Replica waste: lots of pods, no traffic generator by default
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overreplicated
  namespace: waste-lab
spec:
  replicas: 8
  selector:
    matchLabels:
      app: overreplicated
  template:
    metadata:
      labels:
        app: overreplicated
    spec:
      containers:
      - name: web
        image: nginx:alpine
        resources:
          requests:
            cpu: "150m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        ports:
        - containerPort: 80
---
# E) Service bloat (unused services): your tool can detect services with no endpoints
apiVersion: v1
kind: Service
metadata:
  name: unused-service
  namespace: waste-lab
spec:
  selector:
    app: does-not-exist
  ports:
  - port: 80
    targetPort: 80
---
# F) A PVC that requests small, but PV capacity can be much larger (depending on storageclass)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: small-claim
  namespace: waste-lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
